# Publica uma versão nova: suba "version" no package.json, faça commit e crie a tag.
#   git tag v0.2.0 && git push origin v0.2.0
# O instalador do Windows e o latest.yml vão para a Release da tag; os apps instalados baixam sozinhos.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall: prisma generate + SQLite compilado para o Electron
      - run: npm ci

      - name: Conferir versão da tag
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "v$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} diferente da versão do package.json (v$PKG)"; exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # O electron-builder só gera os arquivos; o envio é feito pelo gh logo abaixo.
      # (Publicando direto, ele criava a Release duas vezes em paralelo e saía antes de enviar o .exe.)
      - name: Gerar instalador
        run: npx electron-builder --win --publish never

      - name: Publicar na Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Versão ${GITHUB_REF_NAME#v}" --generate-notes
          SETUP="dist/Gestao-Oficina-Setup-${GITHUB_REF_NAME#v}.exe"
          gh release upload "$GITHUB_REF_NAME" "$SETUP" "$SETUP.blockmap" dist/latest.yml --clobber
          # Confere que os três arquivos estão lá (o programa instalado precisa do latest.yml e do .exe).
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          echo "$ASSETS" | grep -q '\.exe$' && echo "$ASSETS" | grep -q '^latest\.yml$' || { echo "Faltam arquivos na Release"; exit 1; }
